name: "Carrick"
description: "Add a TypeScript service to your Carrick org index, queryable by AI coding agents over MCP."

branding:
  icon: "link"
  color: "blue"

inputs:
  path:
    description: "Path to analyze"
    required: false
    default: "."
  install-dependencies:
    description: |
      Install the scanned repository's dependencies before the scan, so types
      that resolve through a package are real types instead of `any`.

      "auto" (the default) installs when a lockfile sits at the path being
      analyzed, with lifecycle scripts disabled, and skips otherwise. Set it to
      "false" to scan the checkout as-is. A failed or slow install is not an
      error: Carrick warns and scans the bare checkout.

      Private registries use your own auth. Set NPM_TOKEN (or whatever your
      .npmrc references) in the job's `env:` and the install step inherits it.
    required: false
    default: "auto"

outputs:
  success:
    description: "Analysis completed successfully (also 'true' when the run was skipped on a fork PR, where GitHub withholds OIDC credentials)"
    value: ${{ steps.fork-check.outputs.skip == 'true' && 'true' || steps.analysis.outputs.success }}
  issues-found:
    description: "Number of API issues detected ('0' can also mean the run was skipped on a fork PR, where GitHub withholds OIDC credentials)"
    value: ${{ steps.fork-check.outputs.skip == 'true' && '0' || steps.analysis.outputs.issues-found }}

runs:
  using: "composite"
  steps:
    - name: Check fork PR (OIDC unavailable)
      id: fork-check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
      run: |
        # GitHub withholds OIDC credentials (ACTIONS_ID_TOKEN_REQUEST_URL /
        # ACTIONS_ID_TOKEN_REQUEST_TOKEN) from pull_request runs that originate
        # from forks, so the scanner cannot authenticate to the Carrick cloud.
        # Skip successfully rather than fail the contributor's PR red — the
        # scan runs when a maintainer pushes the branch to this repository.
        #
        # Only genuine forks (head repo differs from base repo) get the green
        # skip. A same-repo run with the OIDC env vars absent means the
        # workflow forgot `permissions: id-token: write` — fail loudly with the
        # fix instead of silently never scanning.
        SKIP=false
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
          SKIP=true
          echo "::notice::Carrick skipped: fork PRs don't receive OIDC credentials, so this run can't authenticate to the Carrick cloud. The check will run when a maintainer pushes the branch to this repository."
        elif [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::Carrick can't mint an OIDC token: this run has no ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN. Add 'permissions: id-token: write' to the workflow (or job) so Carrick can authenticate to the cloud."
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.fork-check.outputs.skip != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Resolve the Carrick version
      if: steps.fork-check.outputs.skip != 'true'
      id: version
      shell: bash
      run: |
        # Pin to the release matching this action checkout: release-please
        # bumps Cargo.toml and npm/carrick/package.json in the same commit it
        # tags, so the version here identifies what this ref shipped with.
        # Without the pin every run would float to the latest published
        # package regardless of which action ref the workflow pinned.
        VERSION=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
        echo "Using carrick@$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    # The scanned repo's own dependencies, not Carrick's. Without them every
    # import from a package resolves to the compiler's `error` type and the
    # indexed request/response types degrade to `any`. Lockfile-gated,
    # scripts disabled, time-boxed, and tolerant: see
    # scripts/install-scanned-deps.sh for the posture and why it installs at
    # the scan root only.
    - name: Detect the scanned repo's package manager
      if: steps.fork-check.outputs.skip != 'true' && inputs.install-dependencies != 'false'
      id: deps
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install-scanned-deps.sh" detect "$SCAN_PATH" \
          | tee -a "$GITHUB_OUTPUT"

    # Keyed on the lockfile's hash, so a repo whose dependencies did not change
    # reuses the manager's download store. The store, not node_modules: `npm
    # ci` deletes node_modules before installing, and a cache written from a
    # half-finished install would poison the next run.
    - name: Restore the package manager's store
      # `continue-on-error` is not supported on a composite action's steps, so
      # this leans on actions/cache's own behaviour: a restore that misses or
      # fails warns, it does not fail the step.
      if: steps.fork-check.outputs.skip != 'true' && steps.deps.outputs.should_install == 'true' && steps.deps.outputs.cache_dir != ''
      uses: actions/cache@v4
      with:
        path: ${{ steps.deps.outputs.cache_dir }}
        key: carrick-deps-${{ runner.os }}-${{ steps.deps.outputs.manager }}-${{ steps.deps.outputs.lockfile_sha256 }}
        restore-keys: |
          carrick-deps-${{ runner.os }}-${{ steps.deps.outputs.manager }}-

    - name: Install the scanned repo's dependencies
      if: steps.fork-check.outputs.skip != 'true' && steps.deps.outputs.should_install == 'true'
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        PACKAGE_MANAGER: ${{ steps.deps.outputs.manager }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/install-scanned-deps.sh" install "$SCAN_PATH" "$PACKAGE_MANAGER"

    - name: Run analysis
      if: steps.fork-check.outputs.skip != 'true'
      id: analysis
      shell: bash
      env:
        # Auth is keyless: the scanner mints a GitHub Actions OIDC token from
        # ACTIONS_ID_TOKEN_REQUEST_URL / ACTIONS_ID_TOKEN_REQUEST_TOKEN (present
        # automatically when the job grants `permissions: id-token: write`) and
        # sends it as X-Carrick-OIDC. No API key required.
        CI: "true"
      run: |
        # Stream output live (multi-minute scans shouldn't look hung) while
        # still capturing it for the issue-count grep below. The log lives in
        # RUNNER_TEMP so it never pollutes the user's workspace.
        LOG_FILE="$RUNNER_TEMP/carrick-analysis.log"

        # One artefact: the npm package carries the binary for this runner
        # (an optional dependency npm resolves by os and cpu) and the type
        # sidecar with its dependencies, so there is nothing to download,
        # untar or `npm ci` here.
        set +e
        npx --yes "carrick@${{ steps.version.outputs.version }}" "${{ inputs.path }}" 2>&1 | tee "$LOG_FILE"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        ISSUES=0
        if grep -q "CARRICK_ISSUE_COUNT:" "$LOG_FILE"; then
          # -m1: only the first marker counts — log echoes of the output (or a
          # rerun appending to the same log) must not yield a multi-line value.
          ISSUES=$(grep -m1 "CARRICK_ISSUE_COUNT:" "$LOG_FILE" | sed 's/.*CARRICK_ISSUE_COUNT:\([0-9]*\).*/\1/')
        fi

        if [ $EXIT_CODE -eq 0 ]; then
          echo "success=true" >> $GITHUB_OUTPUT
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi

        echo "issues-found=$ISSUES" >> $GITHUB_OUTPUT

        # PR comments are posted by the Carrick GitHub App from the cloud, not
        # by this workflow: on pull_request runs the scanner relays the
        # rendered findings to api.carrick.tools, which upserts one marked
        # comment (gated on the project's pr_comments_enabled toggle). No
        # github-script step or pull-requests:write permission is needed here.

        exit $EXIT_CODE
