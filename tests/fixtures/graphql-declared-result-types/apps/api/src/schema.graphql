scalar JSON

type Query {
  invoice(id: ID!): Invoice
  note(id: ID!): Note
  ledger: Ledger
}

type Mutation {
  sendInvoice(id: ID!): Invoice!
}

type Invoice {
  id: ID!
  total: Int!
  dueAt: String
  status: InvoiceStatus!
}

type Note {
  id: ID!
  body: String!
}

type Ledger {
  id: ID!
  entries: JSON
}

enum InvoiceStatus {
  DRAFT
  SENT
}
