type Mutation {
  dispatchParcel(id: ID!): Parcel!
  recallParcel(id: ID!): Boolean!
  retireParcel(id: ID!): Boolean!
}

type Parcel {
  id: ID!
  weightGrams: Int!
}

type Query {
  archivedParcels: [Parcel!]!
  health: String!
  heaviestWeight: Int
  parcel(id: ID!): Parcel
  parcelCount: Int!
  parcels: [Parcel!]!
  pendingParcels: [Parcel!]!
  recentParcels: [Parcel!]!
}
