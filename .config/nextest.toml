# Settings for `cargo nextest run`, which runs each test in its own process
# and every binary's tests side by side (see .github/workflows/ci.yml).
# `#[serial]` only orders tests inside one process, so a test that must not
# overlap another is named here instead.

# A test that counts the `carrick-recheck-*` generations a re-check stages
# hands that re-check a temp directory of its own as `TMPDIR` rather than
# claiming the shared one here (carrick#3456).

# Both assert a 300 ms median for a read, which another running test's CPU use
# would inflate. Claiming every slot keeps them alone on the machine.
[[profile.default.overrides]]
filter = 'binary(=local_mode_test) & (test(=status_answers_for_the_workspace) | test(=a_read_costs_what_a_hook_can_afford))'
threads-required = 'num-cpus'
