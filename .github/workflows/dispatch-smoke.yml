name: dispatch-smoke

# The cold-cache dispatch smoke (carrick#1259): hands a fixture's prompts to
# Carrick Cloud for real, waits for the driver, and collects them.
#
# It exists because carrick#1257 — a dispatch the cloud refused with a 400
# because the scanner sent no `scan_id` — shipped with both repos' CI green.
# Neither side's tests can catch that class: the cloud's supply a scan id, the
# scanner's never call the cloud. Only a run that crosses the seam can.
#
# NOT a per-PR check. Each run makes real model calls over a six-file fixture —
# a few cents — so it runs nightly, on demand, and on a PR that asks for it by
# label. Runner minutes are free on this public repo; the inference is not.
on:
  # No nightly schedule yet: the CARRICK_SMOKE_TOKEN secret and
  # DISPATCH_SMOKE_REPO variable do not exist, so a scheduled run would fail
  # every night. Re-add `schedule:` once the owner has ruled on carrick#1259.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# One dispatch at a time. The cloud holds an in-flight slot per repo while a
# job is open, so two runs against the same fixture repo would refuse each
# other. Never cancel one in flight: the run's own cleanup is what gives the
# slot back.
concurrency:
  group: dispatch-smoke
  cancel-in-progress: false

# Deliberately no `id-token: write`. `CloudAuth::detect` (src/credentials.rs)
# takes the OIDC path whenever the runner offers one, before it looks at
# CARRICK_TOKEN — and an OIDC run opens no scan, so it has no scan_id to
# dispatch with and the cloud refuses it. That is the exact shape of the bug
# this guards, so the smoke would fail looking like its own subject. If you are
# here to add the permission, you are about to break it.
permissions:
  contents: read

jobs:
  dispatch-smoke:
    name: Cold-cache dispatch and resume
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'smoke:dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Before anything is built, so a missing credential costs ten seconds
      # rather than ten minutes.
      - name: Check the smoke is configured
        env:
          CARRICK_TOKEN: ${{ secrets.CARRICK_SMOKE_TOKEN }}
          CARRICK_SMOKE_REPO: ${{ vars.DISPATCH_SMOKE_REPO }}
        run: |
          missing=""
          [ -n "$CARRICK_TOKEN" ] || missing="$missing CARRICK_SMOKE_TOKEN (secret)"
          [ -n "$CARRICK_SMOKE_REPO" ] || missing="$missing DISPATCH_SMOKE_REPO (variable)"
          if [ -n "$missing" ]; then
            echo "::error::this smoke needs$missing. See scripts/dispatch-smoke.sh for what each is."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            src/sidecar/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build type sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Build scanner (release)
        env:
          CARRICK_API_ENDPOINT: https://api.carrick.tools
        run: cargo build --release

      - name: Dispatch, wait, resume
        env:
          CARRICK_TOKEN: ${{ secrets.CARRICK_SMOKE_TOKEN }}
          CARRICK_SMOKE_REPO: ${{ vars.DISPATCH_SMOKE_REPO }}
          CARRICK_API_ENDPOINT: https://api.carrick.tools
        run: ./scripts/dispatch-smoke.sh
