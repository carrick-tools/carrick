name: Release Artifacts

# Builds the two artifacts carrick-cloud pins from a release, attaches them to
# the GitHub release, and dispatches the pin bumps in carrick-cloud:
#   - the carrick-match wasm artifact, the query-time matcher that
#     carrick-cloud's mcp-server runs (see crates/carrick-match, #325);
#   - the surface lister, the type sidecar bundled into one file that the
#     library store runs to list a package (carrick-lister.mjs and its
#     manifest, carrick#1660).
#
# Two entry points:
#   - workflow_call from release.yml, on every release-please release
#   - workflow_dispatch against an existing tag, to backfill or re-notify

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build from and attach assets to"
        required: true
        type: string
    secrets:
      CARRICK_CLOUD_DISPATCH_TOKEN:
        description: "Fine-grained PAT able to fire repository_dispatch on carrick-tools/carrick-cloud (contents:write + pull-requests:write there). Optional: without it assets still attach; only the notify step fails."
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build from and attach assets to (e.g. carrick-v0.2.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  wasm-artifact:
    name: Build, attach, dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      # The release steps' script from this workflow's own commit, not the
      # tag's: a backfill of a tag from before the script still runs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts/release-artifacts.sh
          sparse-checkout-cone-mode: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build carrick-match for wasm32
        run: cargo build --target wasm32-unknown-unknown -p carrick-match --features wasm --release

      # Version must match the exact wasm-bindgen pin in
      # crates/carrick-match/Cargo.toml; bump both in lockstep.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Generate Node.js glue
        run: wasm-bindgen --target nodejs --out-dir wasm-artifact target/wasm32-unknown-unknown/release/carrick_match.wasm

      # The artifact runs on carrick-cloud's Node 22 Lambda runtime — smoke
      # it under the same major, not whatever the runner's default is.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Same assertions as ci.yml's wasm-match smoke, but against the exact
      # bytes being attached to the release.
      - name: Load glue in Node and assert matching
        run: |
          node -e "
            const assert = require('assert');
            const m = require('./wasm-artifact/carrick_match.js');
            assert.strictEqual(m.paths_match('/users/:id', '/users/123'), true);
            assert.strictEqual(m.paths_match('/users/123', '/users/:id'), true);
            assert.strictEqual(m.paths_match('/api/**', '/api/users/123/orders'), true);
            assert.strictEqual(m.paths_match('/users', '/orders'), false);
            assert.strictEqual(m.is_param_segment(':id'), true);
            assert.strictEqual(m.is_param_segment('users'), false);
            assert.strictEqual(m.is_unknown_call_path('/*'), true);
            assert.strictEqual(m.is_unknown_call_path('/api/v1/login'), false);
            assert.strictEqual(m.match_verdict('/*', '/*'), m.MatchVerdict.UnknownCallPath);
            assert.strictEqual(m.match_verdict('/*', '/api/v1/login'), m.MatchVerdict.CatchAllRoute);
            assert.strictEqual(m.reportable_agreement('/*', '/api/v1/login'), undefined);
            assert.strictEqual(m.reportable_agreement('/files/**', '/files/report'), 1);
            assert.strictEqual(m.method_matches('ALL', 'POST'), true);
            assert.strictEqual(m.method_matches('get', 'GET'), true);
            assert.strictEqual(m.method_matches('POST', 'ALL'), false);
            console.log('wasm artifact smoke ok');
          "

      - name: Write checksums
        working-directory: wasm-artifact
        run: sha256sum carrick_match.js carrick_match.d.ts carrick_match_bg.wasm > carrick_match.sha256

      # The matcher first: whatever happens to the lister below, the matcher
      # is attached and announced, because its pin bump is what every cloud
      # deploy waits on.
      - name: Attach the matcher to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: bash release-tools/scripts/release-artifacts.sh upload-matcher "$TAG"

      # The surface lister (carrick#1660): the sidecar at this tag in one
      # self-contained file, and the manifest the library store's pin copies.
      # Its steps never stop the job: a failure is a warning here, the lister
      # is neither attached nor announced, and the last step fails the job so
      # it is seen. A tag from before the lister has no build script, and its
      # release carries the matcher only.
      - name: Build the surface lister
        id: lister_build
        continue-on-error: true
        timeout-minutes: 15
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f src/sidecar/lister/build.mjs ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          (cd src/sidecar && npm ci && npm run build && npm ci --prefix lister)
          node src/sidecar/lister/build.mjs --tag "$TAG" --source-sha "$(git rev-parse HEAD)" --out lister-artifact
          echo "built=true" >> "$GITHUB_OUTPUT"

      # On the store's Node 22 (set up above), against the exact bytes
      # attached below.
      - name: Test the surface lister on Node 22
        id: lister_test
        if: steps.lister_build.outputs.built == 'true'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: src/sidecar
        env:
          CARRICK_LISTER_ARTIFACT: ${{ github.workspace }}/lister-artifact/carrick-lister.mjs
        run: node --test dist/test/lister/lister-artifact.test.js dist/test/library-surface.test.js

      - name: Decide whether the surface lister ships
        id: lister
        env:
          BUILD_OUTCOME: ${{ steps.lister_build.outcome }}
          BUILT: ${{ steps.lister_build.outputs.built }}
          TEST_OUTCOME: ${{ steps.lister_test.outcome }}
        run: bash release-tools/scripts/release-artifacts.sh lister-status

      # Continues on error too: an upload that fails (the network, an asset a
      # backfill finds already there) must not stop the matcher's dispatch.
      - name: Attach the surface lister to the release
        id: lister_attach
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          LISTER_OK: ${{ steps.lister.outputs.ok }}
        run: bash release-tools/scripts/release-artifacts.sh upload-lister "$TAG"

      # Fires .github/workflows/wasm-pin-bump.yml in carrick-cloud, which
      # opens the pin-bump PR against the freshly attached assets. The same
      # event carries the lister manifest's sha256 when the lister passed and
      # is attached, so the cloud can verify the manifest it downloads before
      # it copies the lister pin from it (carrick-cloud#1579). The default
      # GITHUB_TOKEN cannot dispatch cross-repo: CARRICK_CLOUD_DISPATCH_TOKEN
      # is a fine-grained PAT with contents:write + pull-requests:write on
      # carrick-tools/carrick-cloud. Assets are already attached by this point,
      # so a failure here means notify-only is what's missing — re-run via
      # workflow_dispatch with the same tag once the secret exists.
      - name: Dispatch pin bump to carrick-cloud
        env:
          GH_TOKEN: ${{ secrets.CARRICK_CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag }}
          LISTER_OK: ${{ steps.lister.outputs.ok }}
          LISTER_ATTACHED: ${{ steps.lister_attach.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CARRICK_CLOUD_DISPATCH_TOKEN is not set; assets are attached but carrick-cloud was not notified." >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)" bash release-tools/scripts/release-artifacts.sh dispatch "$TAG"

      # Last, so the matcher is attached and announced first: a lister that
      # failed to build, test or attach fails the job here, where it is seen.
      - name: Surface lister failed
        if: always() && (steps.lister.outputs.status == 'failed' || steps.lister_attach.outcome == 'failure')
        env:
          TAG: ${{ inputs.tag }}
          STATUS: ${{ steps.lister.outputs.status }}
          ATTACHED: ${{ steps.lister_attach.outcome }}
        run: |
          echo "::error title=Surface lister not released::The surface lister was not released at ${TAG} (build and tests: ${STATUS}; attach: ${ATTACHED}). The matcher was attached and announced; the lister was not. Fix it and re-run this workflow with workflow_dispatch for this tag."
          exit 1
