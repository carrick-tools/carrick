name: eval-xrepo

# Cross-repo accuracy eval (S4 thin slice, #203): scores the live scanner over
# the authored `xrepo-corpus-1` constellation and reports two metric families,
# report-only — a MONITOR, never a gate:
#   1. endpoint-set P/R/F1 (contract §6 row 1)
#   2. cross-repo match P/R/F1 (contract §6 row 7)
#
# On-demand only (workflow_dispatch) — each run makes real LLM calls over a
# 3-repo (multi-framework) corpus and costs money + is stochastic, so it must
# NOT sit on the merge/PR path (build plan §7 slice 4: the only per-merge gate is
# the deterministic cassette seatbelt). The full monitor cadence
# (debounced-on-main + issue-filing) is DEFERRED to a follow-up.
#
# Auth is GitHub Actions OIDC: the scanner is keyless, so this needs
# `id-token: write` and no stored secret. The two-phase harness strips the
# runner's GITHUB_REPOSITORY/REF/EVENT_NAME (so each corpus repo keeps its own
# identity) but KEEPS ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN so the scanner can mint
# its OIDC token for the real LLM call. Uploads go to a local cache dir
# (CARRICK_LOCAL_STORAGE_DIR), never the real cloud index.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "N repeated cross-repo scans (variance / mean±sd sample size)"
        required: false
        default: "5"
      corpus:
        description: "corpus fixture dir name under tests/fixtures/"
        required: false
        default: "xrepo-corpus-1"
      install_corpus_deps:
        description: "npm-install each corpus repo before scanning (false = bare checkout, the Action's default posture)"
        required: false
        type: boolean
        default: true
      force_analyzed_endpoints:
        description: "EXPERIMENT #463 (this branch only): what to do with endpoints reported for a force-analyzed file whose candidate map is empty. drop = today's behaviour."
        required: false
        type: choice
        options: ["drop", "keep", "witness"]
        default: "drop"

permissions:
  id-token: write
  contents: read

jobs:
  eval-xrepo:
    name: Cross-repo extraction quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            src/sidecar/package-lock.json

      - name: Build type sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Install corpus dependencies
        if: ${{ inputs.install_corpus_deps }}
        env:
          CORPUS_INPUT: ${{ inputs.corpus }}
        run: |
          # Validate before the name touches a shell glob: only the fixture-dir
          # basename charset — no path separators, `..`, or glob metacharacters.
          if ! printf '%s' "$CORPUS_INPUT" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::CARRICK_EVAL_CORPUS '$CORPUS_INPUT' must match ^[A-Za-z0-9._-]+$"
            exit 1
          fi
          for dir in tests/fixtures/"$CORPUS_INPUT"/*/; do
            if [ -f "${dir}package.json" ]; then (cd "$dir" && npm install); fi
          done

      - name: Build scanner (release)
        env:
          CARRICK_API_ENDPOINT: https://api.carrick.tools
        run: cargo build --release

      - name: Run cross-repo live scorer
        env:
          CARRICK_API_ENDPOINT: https://api.carrick.tools
          CARRICK_EVAL_LIVE: "1"
          CARRICK_EVAL_RUNS: ${{ inputs.runs }}
          CARRICK_EVAL_CORPUS: ${{ inputs.corpus }}
          # Intents feed only the MCP index — no eval dimension consumes them —
          # and they are one LLM call per eligible function, the dominant cost
          # term on large corpora (fresh eval runs never carry a prior scan's
          # content-hash cache). Skip them in eval scans.
          CARRICK_SKIP_INTENTS: "1"
          # #359 capture mode: persist every file-analyzer request/response so
          # the exact live prompt for any file can be replayed in the cloud
          # prompt harness. The scanner child processes inherit this env.
          CARRICK_EVAL_DUMP_DIR: ${{ github.workspace }}/target/eval-dump
          # EXPERIMENT #463 (this branch only). Absent/`drop` is today's
          # behaviour exactly; `keep`/`witness` admit endpoints reported for a
          # force-analyzed file whose candidate map is empty by construction.
          CARRICK_FORCE_ANALYZED_ENDPOINTS: ${{ inputs.force_analyzed_endpoints }}
        run: |
          cargo test --release --test eval_xrepo -- \
            --ignored xrepo_live_scorer --test-threads=1 --nocapture

      # EXPERIMENT #463 (this branch only): the per-file `[#463]` policy lines
      # are `debug!`, which the harness's non-verbose scanner invocation keeps
      # off stderr but which always reach the rolling file log.
      - name: Upload scanner debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrick-debug-log-${{ inputs.corpus }}-${{ inputs.force_analyzed_endpoints }}
          path: ~/.carrick/logs/
          if-no-files-found: warn

      # #359: raw analyzer I/O per file (input prompt + raw model response).
      - name: Upload analyzer dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-dump
          path: target/eval-dump/
          if-no-files-found: warn

      # Push the run's record to the durable Axiom history (carrick-cloud
      # eval-ingest). The scanner mints its own OIDC token internally and can't
      # share it, so this step mints one for the same audience the cloud expects.
      # Non-blocking: a failed ingest must never red the eval — the monitor's
      # value is the printed report + the artifact below.
      - name: Push eval records to cloud history
        if: always()
        env:
          CARRICK_API_ENDPOINT: https://api.carrick.tools
        run: |
          set -uo pipefail
          files=$(ls target/eval-runs/xrepo-run-*.jsonl 2>/dev/null || true)
          if [ -z "$files" ]; then echo "no eval records to push"; exit 0; fi
          oidc=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.carrick.tools" \
            | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "could not mint OIDC token; skipping push"; exit 0
          fi
          for f in $files; do
            code=$(curl -sS -o /tmp/ingest_resp.json -w '%{http_code}' -X POST \
              -H "X-Carrick-OIDC: ${oidc}" \
              -H "Content-Type: application/x-ndjson" \
              --data-binary "@${f}" \
              "${CARRICK_API_ENDPOINT}/eval/ingest" || echo "000")
            echo "POST ${f} -> HTTP ${code}"
            cat /tmp/ingest_resp.json 2>/dev/null || true
            echo
          done

      - name: Upload eval run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-xrepo-runs-jsonl
          path: |
            target/eval-runs/xrepo-run-*.jsonl
          if-no-files-found: warn
