name: CI

# No `push` trigger: a commit reaches main through the merge queue, whose
# `merge_group` run has already tested that exact tree, so a push run re-tested
# the same sha and nothing read it (carrick#2149). The one thing the push run
# did that mattered, saving the dependency cache on main (the only ref other
# branches can restore from), is now `main-cache.yml`.
on:
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, so superseded runs stop
# occupying runners (each run starts about 28 jobs; carrick#2156). A merge_group
# run is never cancelled: `head_ref` is empty there, so the group falls back to
# the unique run_id.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust tests run as 16 shards on 16 runners. Each shard compiles only the
  # library and the test binaries it runs (about 40 s), so the slowest shard,
  # not the sum, is what a PR waits on. Before the split four shards of
  # 260-400 s each compiled every target they ran in one `cargo test` call.
  #
  # How the map was built: nextest shards (lib-*, n*) hold about 275 summed
  # test-seconds each (about 70 s at four tests at once); scan shards hold
  # about 66 s each. Two things cut a binary across shards, both with nextest
  # `--partition slice:k/m` (even; `count:` is deprecated upstream): the
  # library's unit tests (lib-1, lib-2) and `local_mode_test` (n2, n3). A
  # `partitioned:` target runs in its own nextest call, because `--partition`
  # slices every test of a call, not one binary of it. `local_mode_test` runs
  # first in its shard; two of its tests claim every slot (.config/nextest.toml).
  # `scan-*` shards stay on `cargo test`. `steps` keeps one `cargo test` per
  # binary, in map order, then carrick-match last: the timing tests (readiness,
  # operation timeout, fresh process) and the signal and panic-hook tests need
  # a machine with no other test binary on it, and carrick-match flips features
  # the other targets are built with (carrick#2150).
  #
  # To rebalance: sum each binary's per-test durations from a recent main
  # run (the log parser in the first comment of #2149), read
  # `finished in` per scan binary (cargo test sometimes prints a binary's
  # `test result` line after the next binary's `Running` line, so pair
  # them by test count), and compare shards within one run: the same
  # tests take 1.6 times longer on the slowest runner than the fastest.
  #
  # Every tests/*.rs is named by exactly one shard, or by m shards as
  # `partition: slice:1/m` to `slice:m/m`; `scripts/ci-wired-check.py`
  # (job `wired`) fails on one that is not. The `ci-result` gate below is
  # the single required check for all of CI.
  rust-tests:
    name: Rust tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lib-1
            runner: nextest
            partitioned: --lib
            partition: slice:1/2
          - shard: lib-2
            runner: nextest
            partitioned: --lib
            partition: slice:2/2
          - shard: n1
            runner: nextest
            targets: >-
              --test client_semantics_test --test url_bases_through_bindings_test --test nonhttp_source_labels_test --test literal_base_url_test --test object_export_surface_test --test file_centric_analysis_test --test output_contract_test
          - shard: n2
            runner: nextest
            partitioned: --test local_mode_test
            partition: slice:2/2
            targets: >-
              --test socket_namespace_test --test new_url_target_test --test scan_durability_test --test node_module_extensions_test --test analysis_failure_keeps_deterministic_rows_test --test scan_timing_lines_test
          - shard: n3
            runner: nextest
            partitioned: --test local_mode_test
            partition: slice:1/2
            targets: >-
              --test sidecar_parent_gone_test --test library_claims_sidecar_test --test log_value_guard_test --test file_based_routing_test --test url_alias_matching_test
          - shard: n4
            runner: nextest
            targets: >-
              --test shadowed_binding_test --test library_store_test --test graphql_declared_result_types_test --test nested_service_walk_test --test graphql_code_first_resolvers_test --test wrapper_chain_const_url_test --test service_derivation_test --test llm_mock_pipeline_test --test extraction_config_test
          - shard: n5
            runner: nextest
            targets: >-
              --test request_summary_test --test object_key_url_wrapper_test --test incremental_raw_cache_test --test socket_class_field_test --test alias_shaped_type_imports_test --test span_locator_units_test --test ask_in_parts_test --test dispatch_resume_test --test socket_extraction_test
          - shard: n6
            runner: nextest
            targets: >-
              --test conditional_request_url_test --test in_process_publish_test --test graphql_located_operation_types_test --test wrapper_dispatch_test --test workspace_member_callers_test --test jsx_component_callers_test --test module_resolution_parity_test --test mock_storage_test --test graphql_extraction_test
          - shard: n7
            runner: nextest
            targets: >-
              --test paired_method_url_test --test prompt_determinism_test --test own_route_calls_test --test dispatch_file_route_test --test graphql_schema_identity_test --test sidecar_program_files_test --test inline_registration_scope_test --test socket_generic_test --test dependency_analysis_test
          - shard: n8
            runner: nextest
            targets: >-
              --test retype_consumer_test --test socket_type_alias_test --test union_method_param_test --test graphql_schemas_setting_test --test graphql_walked_schema_evidence_test --test alias_import_callers_test --test receiver_type_classification_test --test intent_incremental_test --test framework_coverage_test --test graphql_document_call_sites_test --test workspace_package_client_test
          - shard: n9
            runner: nextest
            targets: >-
              --test pr_on_main_test --test sidecar_integration_test --test action_install_test --test graphql_code_first_response_types_test --test route_request_anchor_test --test env_var_template_call_segment_test --test commonjs_require_callers_test --test eval_xrepo --test bundle_row_id_golden_test --test derive_matches_scan_test
          - shard: scan-1
            runner: cargo
            targets: >-
              --test hosted_enrichment_test --test wrapper_call_route_test --test spread_options_verb_test --test scan_leaves_repo_unedited_test --test dispatch_dto_enum_test
          - shard: scan-2
            runner: cargo
            targets: >-
              --test keep_awake_test --test pubsub_wrapper_type_capture_test --test descriptor_route_anchor_test --test undeclared_external_host_test --test method_per_site_test --test payload_without_method_test --test unprepared_refusal_test
          - shard: scan-3
            runner: cargo
            targets: >-
              --test deterministic_emission_test --test imported_request_member_test --test run_log_isolation_test --test imported_object_member_test --test call_states_its_verb_test --test props_and_hook_options_test --test interrupted_scan_test
          - shard: scan-4
            runner: cargo
            targets: >-
              --test integration_test --test inline_handler_response_test --test xrepo_harness_test --test env_var_whole_url_test --test exclude_patterns_test --test stated_generic_body_anchor_test --test llm_cassette_hard_gate_test --test response_init_bag_test --test one_row_per_request_test
          - shard: steps
            runner: steps
            targets: >-
              --test capability_sheet_test --test sidecar_readiness_test --test sidecar_operation_timeout_test --test sidecar_fresh_process_test --test shutdown_signal_test --test shutdown_drain_test --test panic_hook_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust-test-setup
        id: setup

      # cargo-nextest runs each test in its own process and the processes of
      # every binary in parallel. Pinned to a release commit; the action
      # downloads the prebuilt binary.
      - name: Install cargo-nextest
        if: matrix.runner == 'nextest'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.148

      # One build of every target this shard runs, before any of it runs, so
      # the test steps find their binaries Fresh.
      - name: Build this shard's targets
        env:
          PARTITIONED: ${{ matrix.partitioned }}
          TARGETS: ${{ matrix.targets }}
        run: |
          # The variables hold several arguments each; word splitting is the point.
          # shellcheck disable=SC2086
          cargo test --no-run $PARTITIONED $TARGETS

      - name: Run this shard's tests
        env:
          RUNNER: ${{ matrix.runner }}
          PARTITIONED: ${{ matrix.partitioned }}
          PARTITION: ${{ matrix.partition }}
          TARGETS: ${{ matrix.targets }}
        run: |
          rc=0
          # Each variable holds several arguments; word splitting is the point.
          # shellcheck disable=SC2086
          case "$RUNNER" in
            nextest)
              if [ -n "$PARTITIONED" ]; then
                cargo nextest run --no-fail-fast $PARTITIONED --partition "$PARTITION" || rc=$?
              fi
              if [ -n "$TARGETS" ]; then
                cargo nextest run --no-fail-fast $TARGETS || rc=$?
              fi
              ;;
            cargo)
              cargo test --verbose $TARGETS || rc=$?
              ;;
            steps)
              for t in ${TARGETS//--test /}; do
                cargo test --test "$t" --verbose || rc=$?
              done
              # Last: it flips carrick-match's features, which would make every
              # target above Dirty if it ran first.
              cargo test -p carrick-match --verbose || rc=$?
              ;;
            *)
              echo "::error::unknown runner $RUNNER"
              rc=1
              ;;
          esac
          exit $rc

      # Endpoint smoke (carrick#2174): two scans of fixture repos on the debug
      # binary the `cargo test --no-run` above already built (it is the binary
      # CARGO_BIN_EXE_carrick points at), in the shard with the fewest slow
      # tests. Never add `cargo build` here: dev-dependencies turn on features
      # (tokio test-util, bitflags std), so it would compile a second copy of
      # the crate and of every dependency that uses them.
      - name: Test basic endpoint detection (express-single)
        if: matrix.shard == 'steps'
        env:
          CARRICK_MOCK_ALL: "true"
        run: |
          mkdir -p examples/express-single/output
          ./target/debug/carrick ./examples/express-single/ > examples/express-single/output/test_output.txt 2>&1
          echo "=== express-single output ==="
          cat examples/express-single/output/test_output.txt
          # Check that we find the expected 3 endpoints
          if ! grep -q "Indexed \*\*3 endpoints\*\*" examples/express-single/output/test_output.txt; then
            echo "ERROR: Expected to find 3 endpoints in examples/express-single"
            exit 1
          fi
          echo "✅ Basic endpoint detection working correctly"

      - name: Test imported router resolution
        if: matrix.shard == 'steps'
        env:
          CARRICK_MOCK_ALL: "true"
        run: |
          mkdir -p tests/fixtures/imported-routers/output
          ./target/debug/carrick ./tests/fixtures/imported-routers/ > tests/fixtures/imported-routers/output/test_output.txt 2>&1
          echo "=== Imported routers test output ==="
          cat tests/fixtures/imported-routers/output/test_output.txt
          # Check that we don't have the regression bug
          if grep -q "Unique endpoint paths: 0" tests/fixtures/imported-routers/output/test_output.txt; then
            echo "ERROR: Found 'Unique endpoint paths: 0' - imported router resolution bug has regressed!"
            exit 1
          fi
          # Check that we find a reasonable number of endpoints (at least 10)
          if ! grep -E "Indexed \*\*[0-9]+ endpoints\*\*" tests/fixtures/imported-routers/output/test_output.txt; then
            echo "ERROR: Expected to find some endpoints in imported router test, but found none"
            exit 1
          fi
          ENDPOINT_COUNT=$(grep -E "Indexed \*\*[0-9]+ endpoints\*\*" tests/fixtures/imported-routers/output/test_output.txt | sed -E 's/.*Indexed \*\*([0-9]+) endpoints\*\*.*/\1/')
          if [ "$ENDPOINT_COUNT" -lt 10 ]; then
            echo "ERROR: Expected at least 10 endpoints, but found $ENDPOINT_COUNT"
            exit 1
          fi
          echo "✅ Imported router resolution working correctly"
          echo "✅ Imported router resolution working correctly ($ENDPOINT_COUNT endpoints found)"

      - name: Upload test outputs as artifacts
        if: always() && matrix.shard == 'steps'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-outputs
          path: |
            examples/express-single/output/test_output.txt
            tests/fixtures/imported-routers/output/test_output.txt

      - uses: ./.github/actions/rust-test-cache-save
        with:
          cache-hit: ${{ steps.setup.outputs.cache-hit }}

  # Every tests/*.rs must be run by a shard above or be listed in the script
  # with a reason. Nine of twenty were silently local-only before this check.
  wired:
    name: Every integration test is wired into CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/ci-wired-check.py

  # The one required check. A matrix job reports as many checks as it has
  # shards, and a ruleset pins each name, so a shard rename or a new job
  # would need a ruleset edit; this job fails unless every job it needs
  # succeeded, so adding a shard needs none. `always()` makes it run (and
  # fail) when a needed job failed or was cancelled instead of being skipped
  # with them. Every other job in this file must be listed in `needs`: the
  # first step fails and names any that is not (carrick#2196). `build` runs
  # only in the merge queue (carrick#2176), so on a pull request it is
  # skipped and the gate accepts that one skip; a skip of any other job, or
  # of `build` in the merge queue, still fails it.
  ci-result:
    name: CI result
    if: always()
    needs:
      - rust-tests
      - wired
      - sidecar
      - build
      - lint
      - security
      - wasm-match
      - lister-artifact
      - release-artifact-steps
    runs-on: ubuntu-latest
    steps:
      # Only this file, so the checkout adds a few seconds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: /.github/workflows/
          sparse-checkout-cone-mode: false

      - name: Every job in this workflow is in needs
        env:
          # Job ids this gate deliberately does not wait for. Empty. A job goes
          # here only by a decision written in the PR that adds it.
          EXCLUDED: ""
        run: |
          f=.github/workflows/ci.yml
          # Read both lists first: a yq failure inside `<( )` would not stop
          # the step, and two empty lists compare as "nothing missing".
          jobs=$(yq -r '.jobs | keys | .[]' "$f" | grep -vx ci-result | sort)
          needs=$(yq -r '.jobs["ci-result"].needs[]' "$f" | sort)
          if [ -z "$jobs" ] || [ -z "$needs" ]; then
            echo "::error::could not read the job ids or ci-result.needs from $f"
            exit 1
          fi
          missing=$(comm -23 <(echo "$jobs") <(echo "$needs"))
          rc=0
          for job in $missing; do
            case " $EXCLUDED " in
              *" $job "*) continue ;;
            esac
            echo "::error::job '$job' is not in ci-result.needs, so it can fail and the PR still merges"
            rc=1
          done
          exit $rc

      - name: Every job this gate needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "event: $EVENT"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e --arg event "$EVENT" 'to_entries | all(.value.result == "success" or (.key == "build" and .value.result == "skipped" and $event == "pull_request"))' > /dev/null; then
            exit 0
          fi
          echo "::error::a job CI result needs did not succeed (failure, cancelled or skipped)"
          exit 1

  # The type sidecar's own unit tests, no Rust. Four shards: four files run
  # real package managers, Deno and tsc over fixture projects (the Deno
  # resolution test alone is two minutes), `heavy`; the other fifty-odd are
  # quick and are dealt out to `rest-1` to `rest-3` by position in the sorted
  # list (every third file), so a new test file lands in a shard with no
  # workflow edit (carrick#2173).
  # Without `--experimental-test-coverage`: the coverage report went to the
  # job log where nobody read it, and instrumenting every file made the
  # suite three times slower (349 s against 114 s, measured on the same
  # machine). `npm run test:coverage` still produces it on demand.
  sidecar:
    name: Sidecar tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [heavy, rest-1, rest-2, rest-3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/sidecar/package-lock.json

      - name: Install Deno for the Deno project resolution tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.4"

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Run sidecar tests
        working-directory: src/sidecar
        run: |
          heavy='deno-project|check-v2-corpus|capture-v2-installed-pin|sidecar\.test\.js'
          shard="${{ matrix.shard }}"
          if [ "$shard" = "heavy" ]; then
            files=$(ls dist/test/*.test.js | grep -E "dist/test/($heavy)")
          else
            n="${shard#rest-}"
            files=$(ls dist/test/*.test.js | grep -v -E "dist/test/($heavy)" | awk -v n="$n" 'NR % 3 == n % 3')
          fi
          echo "$shard: $(echo "$files" | wc -l | tr -d ' ') files"
          echo "$files" | tr ' ' '\n'
          # shellcheck disable=SC2086
          node --test $files

  # The surface lister carrick-cloud's library store runs (carrick#1660): the
  # sidecar bundled into one file, on the store's Node 22 runtime. The listing
  # tests also run on Node 24 in the `rest-*` shards above; the artifact test
  # (dist/test/lister/, outside the shards' glob) needs the bundler's own
  # install. The release builds the artifact and runs both again on the bytes
  # it attaches (wasm-artifact.yml).
  lister-artifact:
    name: Surface lister on Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            src/sidecar/package-lock.json
            src/sidecar/lister/package-lock.json

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build && npm ci --prefix lister

      - name: Run the lister tests
        working-directory: src/sidecar
        run: node --test dist/test/lister/lister-artifact.test.js dist/test/library-surface.test.js

  # The release steps that decide what a release attaches and announces
  # (scripts/release-artifacts.sh), dry-run with `gh` stubbed: a surface
  # lister that fails to build or test must still leave the matcher attached
  # and announced. A tag is the only other place these steps run.
  release-artifact-steps:
    name: Release artifact steps (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dry-run the release steps with a failed and a passed lister
        run: bash scripts/release-artifacts.test.sh

  wasm-match:
    name: carrick-match wasm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build carrick-match for wasm32
        run: cargo build --target wasm32-unknown-unknown -p carrick-match --features wasm --release

      # Version must match the exact wasm-bindgen pin in
      # crates/carrick-match/Cargo.toml; bump both in lockstep. The upstream
      # release binary: `cargo install` compiled the CLI from source on every
      # run, 82 s of a 96 s job.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-bindgen@0.2.126

      - name: Generate Node.js glue
        run: wasm-bindgen --target nodejs --out-dir target/wasm-smoke target/wasm32-unknown-unknown/release/carrick_match.wasm

      # Smoke only: proves the glue loads and the exports answer correctly
      # under Node. The artifact is not uploaded; the committed copy consumed
      # by carrick-cloud is produced and pinned separately.
      - name: Load glue in Node and assert matching
        run: |
          node -e "
            const assert = require('assert');
            const m = require('./target/wasm-smoke/carrick_match.js');
            assert.strictEqual(m.paths_match('/users/:id', '/users/123'), true);
            assert.strictEqual(m.paths_match('/users/123', '/users/:id'), true);
            assert.strictEqual(m.paths_match('/api/**', '/api/users/123/orders'), true);
            assert.strictEqual(m.paths_match('/users', '/orders'), false);
            assert.strictEqual(m.is_param_segment(':id'), true);
            assert.strictEqual(m.is_param_segment('users'), false);
            assert.strictEqual(m.is_unknown_call_path('/*'), true);
            assert.strictEqual(m.is_unknown_call_path('/api/v1/login'), false);
            assert.strictEqual(m.match_verdict('/*', '/*'), m.MatchVerdict.UnknownCallPath);
            assert.strictEqual(m.match_verdict('/*', '/api/v1/login'), m.MatchVerdict.CatchAllRoute);
            assert.strictEqual(m.reportable_agreement('/*', '/api/v1/login'), undefined);
            assert.strictEqual(m.reportable_agreement('/files/**', '/files/report'), 1);
            assert.strictEqual(m.method_matches('ALL', 'POST'), true);
            assert.strictEqual(m.method_matches('get', 'GET'), true);
            assert.strictEqual(m.method_matches('POST', 'ALL'), false);
            console.log('wasm smoke ok');
          "

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # The release compile (about 140 s) runs in the merge queue only: a pull
  # request run skips it, and the `ci-result` gate accepts that skip for this
  # job on `pull_request` alone, so a release-profile break is caught before
  # the merge and not while a PR waits (carrick#2176).
  build:
    name: Build
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-release-

      # Release only. The debug build is what every Rust test shard already
      # compiles; repeating it here doubled this job for nothing.
      - name: Build release
        run: cargo build --release --verbose

      # Run the binary this job just built (carrick#2197), so a break that only
      # a release build has (build.rs stamps the commit only when PROFILE is
      # release, #2178; debug-only checks compile out) is found in the merge
      # queue and not at the RC scan. express-single needs no `node_modules`
      # or sidecar build to be indexed: types degrade, the count does not.
      # Same scan and grep as the debug Endpoint smoke in `rust-tests`.
      - name: Smoke the release binary (scan and commit stamp)
        env:
          CARRICK_MOCK_ALL: "true"
          BIN: ./target/release/carrick
          EXPECTED_ENDPOINTS: "3"
        run: |
          out="$RUNNER_TEMP/express-single-release.txt"
          "$BIN" ./examples/express-single/ > "$out" 2>&1
          grep -F "Indexed **" "$out" || true
          if ! grep -q "Indexed \*\*$EXPECTED_ENDPOINTS endpoints\*\*" "$out"; then
            echo "::error::release binary: expected 'Indexed **$EXPECTED_ENDPOINTS endpoints**' from examples/express-single"
            cat "$out"
            exit 1
          fi
          # No command prints the stamp (it goes into the uploaded blob), but
          # `env!` puts the full commit id in the binary's bytes.
          if [ -z "$GITHUB_SHA" ] || ! grep -aqF "$GITHUB_SHA" "$BIN"; then
            echo "::error::release binary does not carry the commit it was built from ($GITHUB_SHA)"
            exit 1
          fi
          echo "release binary carries commit $GITHUB_SHA"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A prebuilt binary: `cargo install cargo-audit` compiled it from source
      # on every run, three and a half minutes for a tool that changes weekly.
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit
