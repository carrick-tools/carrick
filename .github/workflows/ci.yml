name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust tests run as three shards on three runners. Before this split one
  # job ran every target in series and took fourteen minutes, of which the
  # `local_mode_test` binary alone was 2.4 min, three scan-driving binaries
  # another 1.5, and the sidecar's own unit tests five (see `sidecar` below).
  # Each shard pays its own compile (about two minutes with the cache warm),
  # which is the price of the wall clock: the slowest shard, not the sum,
  # is what a PR waits on.
  #
  # Every tests/*.rs is named by exactly one shard; the "wired into CI" step
  # in rust-unit greps this file and fails on one that is not.
  rust-unit:
    name: Rust unit and fast integration
    runs-on: ubuntu-latest
    env:
      # Line tables keep panic locations and backtraces readable; full
      # debuginfo is what a debugger wants, and nothing here attaches one.
      # Cuts the compile and the link of ~45 test binaries.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-test-setup

      - name: Run library tests
        run: cargo test --lib --verbose

      - name: Run carrick-match tests
        run: cargo test -p carrick-match --verbose

      # Timing assertions on the readiness budget: its own step so the waits
      # are not competing with another test binary for the machine. Needs node
      # (installed above) to run its stand-in sidecar, and fails rather than
      # skips if node is missing, so a green tick means the waits were timed.
      - name: Run sidecar readiness timing tests
        run: cargo test --test sidecar_readiness_test --verbose

      # Fixture- and mock-driven; no live LLM, no env beyond what they set
      # themselves. route_request_anchor_test and span_locator_units_test need
      # the sidecar built above. eval_xrepo is the cross-repo scorer math only:
      # default `cargo test` skips its #[ignore]d live scorer + mock smoke (both
      # spawn the binary / cost money); the live scorer runs via eval-xrepo.yml
      # (workflow_dispatch), NOT here. action_install_test is the Action's
      # dependency-install step (carrick#706), which uses a `file:` dependency
      # and so needs no registry.
      - name: Run fast integration tests
        run: >-
          cargo test --verbose
          --test action_install_test
          --test alias_import_callers_test
          --test analysis_failure_keeps_deterministic_rows_test
          --test dependency_analysis_test
          --test env_var_template_call_segment_test
          --test eval_xrepo
          --test extraction_config_test
          --test file_based_routing_test
          --test file_centric_analysis_test
          --test framework_coverage_test
          --test graphql_extraction_test
          --test graphql_schema_identity_test
          --test graphql_schemas_setting_test
          --test incremental_raw_cache_test
          --test intent_incremental_test
          --test jsx_component_callers_test
          --test literal_base_url_test
          --test llm_mock_pipeline_test
          --test log_value_guard_test
          --test mock_storage_test
          --test module_resolution_parity_test
          --test new_url_target_test
          --test object_export_surface_test
          --test output_contract_test
          --test receiver_type_classification_test
          --test route_request_anchor_test
          --test scan_durability_test
          --test service_derivation_test
          --test sidecar_integration_test
          --test socket_class_field_test
          --test socket_extraction_test
          --test socket_namespace_test
          --test socket_type_alias_test
          --test span_locator_units_test
          --test url_alias_matching_test
          --test url_bases_through_bindings_test
          --test workspace_member_callers_test
          --test workspace_package_client_test
          --test wrapper_chain_const_url_test
          --test wrapper_dispatch_test

      # Every tests/*.rs must be run by a step in one of the Rust shards or be
      # listed here with a reason. Nine of twenty were silently local-only
      # before this step.
      - name: Every integration test is wired into CI
        run: |
          excluded="eval_tier_a"  # eval harness; needs CARRICK_API_ENDPOINT, skips without it
          missing=0
          for f in tests/*.rs; do
            n=$(basename "$f" .rs)
            case " $excluded " in *" $n "*) continue;; esac
            if ! grep -q -- "--test $n" .github/workflows/ci.yml; then
              echo "::error::tests/$n.rs is not run by any CI step (add it or list it in 'excluded' with a reason)"
              missing=1
            fi
          done
          exit $missing

  # The binaries that drive whole scans through the sidecar over fixture
  # repos: seconds to minutes each, and the reason the single job was slow.
  # llm_cassette_hard_gate_test is the frozen-LLM-input golden;
  # undeclared_external_host_test pins the match key of an absolute
  # third-party URL (carrick-cloud#656); neither makes a model call.
  rust-scan:
    name: Rust scan integration
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-test-setup

      - name: Run scan-driving integration tests
        run: >-
          cargo test --verbose
          --test deterministic_emission_test
          --test env_var_whole_url_test
          --test hosted_enrichment_test
          --test imported_request_member_test
          --test integration_test
          --test llm_cassette_hard_gate_test
          --test pubsub_wrapper_type_capture_test
          --test run_log_isolation_test
          --test undeclared_external_host_test
          --test xrepo_harness_test

  # local_mode_test on its own: at 2.4 minutes it is the longest single
  # binary, and pairing it with anything puts that on the critical path.
  rust-local-mode:
    name: Rust local mode
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-test-setup

      - name: Run local mode tests
        run: cargo test --verbose --test local_mode_test

  # The type sidecar's own unit tests, no Rust. Two shards: four files run
  # real package managers, Deno and tsc over fixture projects (the Deno
  # resolution test alone is two minutes), the other fifty-odd are quick.
  # Without `--experimental-test-coverage`: the coverage report went to the
  # job log where nobody read it, and instrumenting every file made the
  # suite three times slower (349 s against 114 s, measured on the same
  # machine). `npm run test:coverage` still produces it on demand.
  sidecar:
    name: Sidecar tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [heavy, rest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/sidecar/package-lock.json

      - name: Install Deno for the Deno project resolution tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Run sidecar tests
        working-directory: src/sidecar
        run: |
          heavy='deno-project|check-v2-corpus|capture-v2-installed-pin|sidecar\.test\.js'
          if [ "${{ matrix.shard }}" = "heavy" ]; then
            files=$(ls dist/test/*.test.js | grep -E "dist/test/($heavy)")
          else
            files=$(ls dist/test/*.test.js | grep -v -E "dist/test/($heavy)")
          fi
          echo "$files" | tr ' ' '\n'
          # shellcheck disable=SC2086
          node --test $files

  wasm-match:
    name: carrick-match wasm smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build carrick-match for wasm32
        run: cargo build --target wasm32-unknown-unknown -p carrick-match --features wasm --release

      # Version must match the exact wasm-bindgen pin in
      # crates/carrick-match/Cargo.toml; bump both in lockstep.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Generate Node.js glue
        run: wasm-bindgen --target nodejs --out-dir target/wasm-smoke target/wasm32-unknown-unknown/release/carrick_match.wasm

      # Smoke only: proves the glue loads and the exports answer correctly
      # under Node. The artifact is not uploaded; the committed copy consumed
      # by carrick-cloud is produced and pinned separately.
      - name: Load glue in Node and assert matching
        run: |
          node -e "
            const assert = require('assert');
            const m = require('./target/wasm-smoke/carrick_match.js');
            assert.strictEqual(m.paths_match('/users/:id', '/users/123'), true);
            assert.strictEqual(m.paths_match('/users/123', '/users/:id'), true);
            assert.strictEqual(m.paths_match('/api/**', '/api/users/123/orders'), true);
            assert.strictEqual(m.paths_match('/users', '/orders'), false);
            assert.strictEqual(m.is_param_segment(':id'), true);
            assert.strictEqual(m.is_param_segment('users'), false);
            assert.strictEqual(m.is_unknown_call_path('/*'), true);
            assert.strictEqual(m.is_unknown_call_path('/api/v1/login'), false);
            assert.strictEqual(m.match_verdict('/*', '/*'), m.MatchVerdict.UnknownCallPath);
            assert.strictEqual(m.match_verdict('/*', '/api/v1/login'), m.MatchVerdict.CatchAllRoute);
            assert.strictEqual(m.reportable_agreement('/*', '/api/v1/login'), undefined);
            assert.strictEqual(m.reportable_agreement('/files/**', '/files/report'), 1);
            assert.strictEqual(m.method_matches('ALL', 'POST'), true);
            assert.strictEqual(m.method_matches('get', 'GET'), true);
            assert.strictEqual(m.method_matches('POST', 'ALL'), false);
            console.log('wasm smoke ok');
          "

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Release only. The debug build is what every Rust test shard already
      # compiles; repeating it here doubled this job for nothing.
      - name: Build release
        run: cargo build --release --verbose

  endpoint-regression-test:
    name: Endpoint Detection Regression Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install express-single example dependencies
        run: cd examples/express-single && npm install

      - name: Install imported-routers test dependencies
        run: cd tests/fixtures/imported-routers && npm install

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Build carrick
        run: cargo build --release

      - name: Test basic endpoint detection (express-single)
        env:
          CARRICK_MOCK_ALL: "true"
        run: |
          mkdir -p examples/express-single/output
          ./target/release/carrick ./examples/express-single/ > examples/express-single/output/test_output.txt 2>&1
          echo "=== express-single output ==="
          cat examples/express-single/output/test_output.txt
          # Check that we find the expected 3 endpoints
          if ! grep -q "Indexed \*\*3 endpoints\*\*" examples/express-single/output/test_output.txt; then
            echo "ERROR: Expected to find 3 endpoints in examples/express-single"
            exit 1
          fi
          echo "✅ Basic endpoint detection working correctly"

      - name: Test imported router resolution
        env:
          CARRICK_MOCK_ALL: "true"
        run: |
          mkdir -p tests/fixtures/imported-routers/output
          ./target/release/carrick ./tests/fixtures/imported-routers/ > tests/fixtures/imported-routers/output/test_output.txt 2>&1
          echo "=== Imported routers test output ==="
          cat tests/fixtures/imported-routers/output/test_output.txt
          # Check that we don't have the regression bug
          if grep -q "Unique endpoint paths: 0" tests/fixtures/imported-routers/output/test_output.txt; then
            echo "ERROR: Found 'Unique endpoint paths: 0' - imported router resolution bug has regressed!"
            exit 1
          fi
          # Check that we find a reasonable number of endpoints (at least 10)
          if ! grep -E "Indexed \*\*[0-9]+ endpoints\*\*" tests/fixtures/imported-routers/output/test_output.txt; then
            echo "ERROR: Expected to find some endpoints in imported router test, but found none"
            exit 1
          fi
          ENDPOINT_COUNT=$(grep -E "Indexed \*\*[0-9]+ endpoints\*\*" tests/fixtures/imported-routers/output/test_output.txt | sed -E 's/.*Indexed \*\*([0-9]+) endpoints\*\*.*/\1/')
          if [ "$ENDPOINT_COUNT" -lt 10 ]; then
            echo "ERROR: Expected at least 10 endpoints, but found $ENDPOINT_COUNT"
            exit 1
          fi
          echo "✅ Imported router resolution working correctly"
          echo "✅ Imported router resolution working correctly ($ENDPOINT_COUNT endpoints found)"

      - name: Upload test outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: |
            examples/express-single/output/test_output.txt
            tests/fixtures/imported-routers/output/test_output.txt

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # A prebuilt binary: `cargo install cargo-audit` compiled it from source
      # on every run, three and a half minutes for a tool that changes weekly.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit
