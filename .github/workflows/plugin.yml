name: Plugin

# The hook, the language server and the VS Code wrapper. Separate from ci.yml so
# the path filter can apply: this job is about the npm package and the host
# manifests that point at it, and nothing in them touches Rust, so a Rust-only
# pull request should not wait on it and a package-only one should not wait on
# the Rust suite.
#
# Everything here runs against fixture payloads and a fake `carrick`
# (npm/carrick/test/fake-carrick.mjs), so no binary, no index and no network beyond
# the installs. carrick#723.

on:
  push:
    branches: [main, develop]
    paths:
      - "npm/**"
      - "plugin/**"
      - "src/sidecar/**"
      - ".github/workflows/plugin.yml"
      # release.yml packages and publishes the extension with the same command
      # the `vsix` job below runs, and nothing else proves that command still
      # works before a tag is cut.
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "npm/**"
      - "plugin/**"
      - "src/sidecar/**"
      - ".github/workflows/plugin.yml"
      # release.yml packages and publishes the extension with the same command
      # the `vsix` job below runs, and nothing else proves that command still
      # works before a tag is cut.
      - ".github/workflows/release.yml"

jobs:
  plugin:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 is the floor: the server and the hooks are TypeScript run directly,
      # and the tests rely on the same type stripping.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            npm/carrick/package-lock.json
            plugin/vscode/package-lock.json

      - name: Install
        working-directory: npm/carrick
        run: |
          # The lockfile cannot be correct for the version being released, so it is
          # regenerated rather than trusted. `optionalDependencies` pins the five
          # platform packages to this exact version, and when release-please writes
          # the release commit those tarballs do not exist yet — no committed
          # lockfile can hold an integrity hash for a package that has not been
          # published. npm records `{"optional": true}` stubs instead, and `npm ci`
          # rejects them the moment the version does exist ("lock file's ...@ does
          # not satisfy ...@0.3.54", release 0.3.54). Regenerating first is right in
          # both states: real entries when the pins resolve, stubs when they do not,
          # and `npm ci` accepts either.
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Typecheck and unit tests
        working-directory: npm/carrick
        run: npm test

      # Counts hook contexts and diagnostic attachments separately for every
      # install shape, and fails when a shape delivers on both channels or
      # neither.
      - name: One channel per install
        working-directory: npm/carrick
        run: npm run selftest

      # The tarball, installed the way a user installs it. Two failures live
      # only here and in nothing above: a `.ts` the package imports, which Node
      # refuses to strip under node_modules, and a runtime dependency the
      # sidecar had only because its own `npm ci` installed devDependencies.
      # `npm pack` runs prepack, which builds the emit, bundles the sidecar and
      # fails on an undeclared import.
      - name: Build the type sidecar
        working-directory: src/sidecar
        run: npm ci && npm run build

      - name: Install the packed package as a user would
        run: |
          set -euo pipefail
          (cd npm/carrick && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir -p "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          echo '{"name":"probe","private":true}' > package.json
          # --omit=optional so this proves the same thing on every day of the
          # week. Without it the platform package for this runner is installed
          # whenever the version happens to be published already, the binary
          # resolves, and the assertion below stops describing anything.
          npm install --ignore-scripts --omit=optional "$RUNNER_TEMP"/carrick-*.tgz
          ./node_modules/.bin/carrick --version
          # No platform package here by construction, so this is the message a
          # user whose platform did not publish sees. It must be a message,
          # not a stack trace — and a non-zero exit here is the
          # expected one, so it is captured rather than run through a pipeline
          # that `pipefail` would then fail on.
          MISSING=$(./node_modules/.bin/carrick check nothing.ts 2>&1 || true)
          echo "$MISSING"
          echo "$MISSING" | grep -q "is not installed"

      # The verdict is the whole point of the local tier, and it is the one
      # thing the steps above cannot see: the check phase spawns a vendored
      # pnpm and tsc, they live somewhere else in an install than in a
      # checkout, and a miss degrades every pair to `unverifiable` rather than
      # failing (carrick#833). So run the same probe against both shapes and
      # require the same verdicts from each. No binary and no network: the
      # stubs are hand-authored and dependency-free, so the check's install is
      # local-only.
      - name: A checkout produces type verdicts
        run: node npm/carrick/scripts/verdict-probe.mjs --sidecar src/sidecar

      - name: The installed package produces the same type verdicts
        run: |
          set -euo pipefail
          node npm/carrick/scripts/verdict-probe.mjs \
            --sidecar "$RUNNER_TEMP/probe/node_modules/carrick/sidecar"

  # What `release.yml` attaches to the release and publishes to Open VSX, built
  # on the pull request. Nothing else runs `vsce package` before a tag is cut,
  # and the version there comes from release-please, so a packaging failure
  # would otherwise surface after the version is already public.
  #
  # Keep the `vsce package` command the same as the one in release.yml.
  vsix:
    name: Extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/vscode/package-lock.json

      - name: Install
        working-directory: plugin/vscode
        run: npm ci

      # Runs vscode:prepublish, so this is also the typecheck of extension.ts.
      # `--out dist/` does not create the directory: with none there, vsce
      # writes a FILE called `dist`.
      - name: Package the extension
        working-directory: plugin/vscode
        run: mkdir -p dist && npx --yes @vscode/vsce package --out dist/

      # What an editor unpacks. The .vscodeignore lives next door to the manifest
      # and an entry that swallowed `node_modules` or `out` would still package
      # cleanly and install as an extension that does nothing.
      - name: The .vsix holds what an editor needs
        working-directory: plugin/vscode
        run: |
          set -euo pipefail
          VSIX=$(ls dist/*.vsix)
          unzip -l "$VSIX" | awk '{ print $4 }' > members.txt
          for member in extension/package.json extension/out/extension.js \
            extension/LICENSE.md \
            extension/node_modules/vscode-languageclient/package.json; do
            grep -qx "$member" members.txt || {
              echo "::error::the .vsix is missing $member"
              exit 1
            }
          done
