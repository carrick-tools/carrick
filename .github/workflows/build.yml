name: Build

# The one place a release-profile carrick is built for a test, a replay, a kit
# or a proof (speed clean-up T7, "One build path"). Callers:
#   - ci.yml, on every pull request head and every merge-queue commit;
#   - workflow_dispatch, for a commit CI has not built (a train branch, a
#     local merge): `gh workflow run build.yml -f ref=<sha-or-branch>`.
# release.yml is not a caller yet; it keeps its own build.
#
# `ref` is a commit, never the synthetic merge ref: build.rs stamps git HEAD
# into the binary, and a pull_request checkout with no ref is a merge commit
# that exists nowhere else. ci.yml passes `pull_request.head.sha`.
#
# Artifacts, kept 14 days, named by the full commit id <sha>:
#   carrick-linux-x64-<sha>, carrick-linux-arm64-<sha>, carrick-darwin-arm64-<sha>
#       the binary, a file named `carrick` at the root (artifacts do not keep the executable bit: chmod +x)
#   carrick-cli-<sha>
#       the npm package tarball (`npm pack`; it bundles the type sidecar)
#   carrick-manifest-<sha>
#       manifest.json at the artifact root: {sha, version, platforms:
#       {<platform>: {artifact, files: {<name>: <sha256>}}}, cli: {artifact,
#       files}}. Read by carrick-cloud's scanner-replay/fetch-build.sh.

on:
  workflow_call:
    inputs:
      ref:
        description: "the commit to build (a full sha)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "the commit to build (a sha or a branch name)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.sha.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Name the commit and its version
        id: sha
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "building $sha ($version) from ${{ inputs.ref }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  binary:
    name: Binary (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      BIN: target/${{ matrix.target }}/release/carrick
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Dependencies only: main-cache.yml saves this on main and strips the
      # carrick crates' own output, so nothing restored here can carry a stale
      # commit stamp. Restore only; a miss builds cold.
      - name: Restore dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - uses: ./.github/actions/build-release
        with:
          target: ${{ matrix.target }}

      # `env!` puts the full commit id in the binary's bytes (build.rs); a
      # binary without it was built from some other tree.
      - name: The binary carries the commit it was built from
        shell: bash
        run: |
          if ! grep -aqF "$SHA" "$BIN"; then
            echo "::error::the binary does not carry the commit it was built from ($SHA)"
            exit 1
          fi
          echo "binary carries commit $SHA"

      - name: The binary needs no glibc above the floor
        if: runner.os == 'Linux'
        run: bash scripts/glibc-floor.sh "$BIN"

      # The type sidecar is not tracked (carrick#4066): the smoke scan below
      # runs against a build of this commit's sidecar source, as the `cli` job
      # packs one.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/sidecar/package-lock.json

      - name: Build sidecar
        shell: bash
        run: cd src/sidecar && npm ci && npm run build

      # The example's routes are labelled from the store's answer about the
      # installed `express` (the cassette in the example), so the smoke scan
      # runs on an installed example, as the test setup installs it
      # (carrick#3711).
      - name: Install the example's dependencies
        shell: bash
        run: cd examples/express-single && npm install

      # Run the binary just built (carrick#2197), so a break only a release
      # build has is found here and not at the RC scan.
      - name: Smoke the binary (scan)
        shell: bash
        env:
          CARRICK_MOCK_ALL: "true"
          CARRICK_MOCK_FIXTURE_DIR: ./examples/express-single/__llm__/
          EXPECTED_ENDPOINTS: "3"
        run: |
          out="$RUNNER_TEMP/express-single-release.txt"
          "./$BIN" ./examples/express-single/ > "$out" 2>&1
          if ! grep -q "Indexed \*\*$EXPECTED_ENDPOINTS endpoints\*\*" "$out"; then
            echo "::error::release binary: expected 'Indexed **$EXPECTED_ENDPOINTS endpoints**' from examples/express-single"
            cat "$out"
            exit 1
          fi

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carrick-${{ matrix.platform }}-${{ needs.resolve.outputs.sha }}
          path: ${{ env.BIN }}
          if-no-files-found: error
          retention-days: 14

  cli:
    name: CLI package
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/sidecar/package-lock.json

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build

      # `npm install`, not `npm ci`, for the reason plugin.yml's `pack` job
      # gives. `npm pack` runs prepack, which builds the emit and bundles the
      # sidecar built above.
      - name: Pack the CLI
        run: |
          set -euo pipefail
          (cd npm/carrick && npm install --ignore-scripts --no-audit --no-fund)
          mkdir -p pack
          (cd npm/carrick && npm pack --pack-destination "$GITHUB_WORKSPACE/pack")
          ls -l pack

      - name: Upload the CLI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carrick-cli-${{ needs.resolve.outputs.sha }}
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Manifest
    needs: [resolve, binary, cli]
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      # Hashes what was uploaded, not what the build job meant to upload.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: carrick-*-${{ needs.resolve.outputs.sha }}
          path: artifacts

      - name: Write the manifest
        run: |
          set -euo pipefail
          cd artifacts
          ls -R .
          for platform in linux-x64 linux-arm64 darwin-arm64 cli; do
            test -d "carrick-$platform-$SHA" || { echo "::error::missing artifact carrick-$platform-$SHA"; exit 1; }
          done
          # {"<filename>": "<sha256>"} for one artifact directory
          files_of() { (cd "$1" && for f in *; do printf '%s\t%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"; done) \
            | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add'; }
          platforms='{}'
          for p in linux-x64 linux-arm64 darwin-arm64; do
            platforms=$(jq -n --argjson acc "$platforms" --arg p "$p" --arg a "carrick-$p-$SHA" --argjson f "$(files_of "carrick-$p-$SHA")" \
              '$acc + {($p): {artifact: $a, files: $f}}')
          done
          mkdir -p ../out
          jq -n --arg sha "$SHA" --arg version "$VERSION" --argjson platforms "$platforms" \
            --arg cli "carrick-cli-$SHA" --argjson cf "$(files_of "carrick-cli-$SHA")" \
            '{sha: $sha, version: $version, platforms: $platforms, cli: {artifact: $cli, files: $cf}}' \
            > ../out/manifest.json
          cat ../out/manifest.json

      - name: Upload the manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carrick-manifest-${{ needs.resolve.outputs.sha }}
          path: out/manifest.json
          if-no-files-found: error
          retention-days: 14
