name: Release

# Two entry points:
#   - push to main, where release-please decides whether a release was created
#   - workflow_dispatch against an existing tag, to publish a release that was
#     tagged but never shipped (carrick#1242)
#
# A transient GitHub API error inside release-please strands a release: the tag
# and the GitHub Release exist, but every publish job is gated on
# `release_created`, and on a re-run release-please sees the release already
# exists and answers `false`, so they all skip again — for ever. 0.3.74 was only
# rescued because 0.3.75 carried its content.
#
# Both paths resolve through the `target` job, which is the ONLY place a tag,
# its commit and the decision to publish are decided. Every later job builds
# from `target`'s resolved commit sha, so a dispatch run cannot build one commit
# and publish it under another commit's version.
#
# Nothing but a real release exercises the jobs below `target`, so the dispatch
# form takes a `dry_run` input: it resolves the tag, checks the commit carries
# that version, and stops. That is the way to rehearse this path.
#
# The dispatch is ONE step, not two: it needs no run approval. The
# first-time-contributor policy that holds the release PR's checks at
# `action_required` — because that PR is authored by `app/github-actions`,
# which is not a repo contributor — applies to `pull_request` runs only. Every
# run of this workflow, and every `workflow_dispatch` run in this repo, has
# started immediately.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. carrick-v0.3.74. Must already exist; nothing here creates a tag."
        required: true
        type: string
      dry_run:
        description: "Resolve and check the tag, then stop. Nothing is built, published, attached or moved."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # The single resolver for both entry points. Everything downstream reads
  # `needs.target.outputs.*` and nothing downstream reads release-please, so the
  # two paths cannot drift.
  #
  # `always()` because on the dispatch path release-please is skipped, and a
  # skipped dependency would skip this job too. A release-please that FAILED
  # must not publish anything, hence the explicit `result == 'success'`.
  target:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Literal 'true'/'false'. Compared as strings downstream: an empty string
      # is falsey in a GitHub `if:`, but so is every typo of the field name.
      publish: ${{ steps.resolve.outputs.publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      # Only the newest release tag may move `v1` or be marked the latest
      # release. Dispatching an older tag otherwise downgrades every workflow
      # pinned to `carrick-tools/carrick@v1`.
      is_latest: ${{ steps.resolve.outputs.is_latest }}
    steps:
      - name: Resolve the tag to publish
        id: resolve
        env:
          # Through the environment, never interpolated into the script: the
          # input is attacker-controlled text as far as the shell is concerned.
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            case "$TAG" in
              *[!A-Za-z0-9.+-]*)
                echo "::error::'$TAG' holds a character no tag of ours contains."
                exit 1
                ;;
              carrick-v[0-9]*) ;;
              *)
                echo "::error::'$TAG' is not a release tag. Expected carrick-v<version>, e.g. carrick-v0.3.74."
                exit 1
                ;;
            esac
          else
            if [ "$RELEASE_CREATED" != "true" ]; then
              echo "release-please created no release; nothing to publish."
              printf 'resolved=false\npublish=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="$RELEASE_TAG"
          fi

          VERSION="${TAG##*v}"

          # The tag pins the commit, not the other way round. Resolved once,
          # here, and every build job checks out this sha: a tag that is moved
          # mid-run cannot change what gets built or published.
          if ! REF=$(gh api "repos/$REPO/git/ref/tags/$TAG" \
            --jq '.object.sha + " " + .object.type' 2>"$RUNNER_TEMP/tag-lookup.txt"); then
            cat "$RUNNER_TEMP/tag-lookup.txt"
            echo "::error::Could not resolve tag $TAG in $REPO — see the API error above. Nothing here creates a tag; cut the release first."
            exit 1
          fi
          SHA="${REF%% *}"
          TYPE="${REF##* }"
          if [ "$TYPE" = "tag" ]; then
            # An annotated tag points at a tag object, which points at the commit.
            SHA=$(gh api "repos/$REPO/git/tags/$SHA" --jq '.object.sha')
          fi

          # Not a gate: a release that does not exist yet is created by the
          # upload steps. Logged because "tagged but no Release" and "tagged
          # with a Release that never published" need different reading.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "GitHub Release for $TAG exists."
          else
            echo "::notice::No GitHub Release for $TAG yet; the asset uploads will create it."
          fi

          # `resolved` says the tag is real and worth checking; `publish` says
          # the rest of the workflow runs. A dry run separates them, so the
          # dispatch path can be exercised against a real tag without
          # publishing, attaching or moving anything.
          PUBLISH=true
          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH=false
            echo "::notice::Dry run: $TAG resolves and will be checked, then the workflow stops."
          fi

          {
            echo "resolved=true"
            echo "publish=$PUBLISH"
            echo "tag_name=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "resolved $TAG -> $SHA (version $VERSION)"

          # The API rather than a clone: this job holds no checkout yet, and the
          # tag list is one authenticated page.
          LATEST=$(gh api "repos/$REPO/tags?per_page=100" --paginate --jq '.[].name' \
            | sed -n 's/^carrick-v//p' \
            | sort -V | tail -1)
          if [ "$VERSION" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not the newest release tag (that is carrick-v$LATEST), so v1 will not be moved and the release will not be marked latest."
          fi

      # The assertion that a dispatch publishes what its tag says it publishes:
      # the version release-please wrote into the manifests at this commit must
      # be the version in the tag name. A mistyped tag, or a tag pointing at the
      # wrong commit, stops here rather than publishing a mislabelled package.
      # `crates/carrick-match/Cargo.toml` is deliberately not checked — it is
      # versioned outside release-please.
      - uses: actions/checkout@v4
        if: ${{ steps.resolve.outputs.resolved == 'true' }}
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: The commit carries the tag's version
        if: ${{ steps.resolve.outputs.resolved == 'true' }}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag_name }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p "require('./npm/carrick/package.json').version")
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$VERSION npm/carrick=$NPM_VERSION Cargo.toml=$CARGO_VERSION at $SHA"
          if [ "$NPM_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::$TAG points at $SHA, where npm/carrick/package.json is $NPM_VERSION and Cargo.toml is $CARGO_VERSION. Publishing that as $VERSION would ship a mislabelled package."
            exit 1
          fi

  # One binary per platform npm can install. The names are the npm platform and
  # arch strings, because that is what `carrick`'s resolver asks for
  # (npm/carrick/src/native.ts) — a rust target triple is a detail of this job.
  binaries:
    needs: target
    if: ${{ needs.target.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          # Both Mac targets on the same Apple-silicon runner: the x86_64
          # target needs `rustup target add` and nothing else, and the
          # Intel-runner labels are being retired.
          - platform: darwin
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          # Nothing in this repo has ever been built or run on Windows. It is
          # allowed to fail rather than hold up a release: a platform package
          # that does not publish leaves an optional dependency that resolves
          # to nothing, which npm skips with a warning.
          - platform: win32
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      # The tag's commit, resolved once by `target`. On the dispatch path
      # `github.sha` is main's head, which is not what is being published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          echo "version=${{ needs.target.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-release-

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build the platform package
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/carrick"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            BINARY="$BINARY.exe"
          fi
          OUT="dist/platform/${{ matrix.platform }}-${{ matrix.arch }}"
          node npm/platform/build.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ steps.version.outputs.version }}" \
            --binary "$BINARY" \
            --out dist/platform
          # Asserted rather than assumed: a script that writes nothing and
          # exits 0 is how the win32 leg of 0.3.52 passed this step with no
          # package to show for it.
          test -f "$OUT/package.json"

      # Packed here, not in the publish job: upload-artifact does not carry a
      # file's mode, so a binary uploaded as a file arrives 0644 and every
      # install of it fails with EACCES. A tarball keeps the executable bit.
      - name: Pack the platform package
        shell: bash
        run: |
          set -euo pipefail
          # npm pack does not create its --pack-destination, and answers ENOENT
          # when it is missing (release 0.3.52 failed here on all five legs).
          TARBALLS="$GITHUB_WORKSPACE/dist/tarballs"
          mkdir -p "$TARBALLS"
          cd "dist/platform/${{ matrix.platform }}-${{ matrix.arch }}"
          npm pack --pack-destination "$TARBALLS"
          ls -l "$TARBALLS"

      - name: Upload the platform package
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/tarballs/*.tgz
          retention-days: 1

  # The release asset the Action has always downloaded. It stays until the npm
  # path is proven on a mirror: a first publish that fails, or publishes four
  # platforms out of five, must not take every customer's scan with it.
  # Its own job, so a failed publish cannot stop the asset being attached.
  action-tarball:
    needs: target
    if: ${{ needs.target.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag's commit, resolved once by `target`. On the dispatch path
      # `github.sha` is main's head, which is not what is being published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/sidecar/package-lock.json

      - name: Build binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build sidecar
        run: cd src/sidecar && npm ci && npm run build

      - name: Create release archive
        run: |
          mkdir -p release/sidecar
          cp target/x86_64-unknown-linux-gnu/release/carrick release/
          cp -r src/sidecar/dist release/sidecar/dist
          cp src/sidecar/package.json release/sidecar/
          cp src/sidecar/package-lock.json release/sidecar/
          cd release
          tar -czf carrick-action-linux.tar.gz carrick sidecar

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.target.outputs.tag_name }}
          files: release/carrick-action-linux.tar.gz
          make_latest: ${{ needs.target.outputs.is_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `v1` means "the Action works at this commit", so it moves with the
      # asset rather than with the npm publish: the Action falls back to the
      # asset, so a release that published nothing to npm is still a release
      # a pinned workflow can run.
      - name: Update v1 moving tag
        if: ${{ needs.target.outputs.is_latest == 'true' }}
        run: |
          VERSION="${{ needs.target.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release version ($VERSION) — skipping v1 update"
            exit 0
          fi
          git tag -f v1 ${{ needs.target.outputs.sha }}
          git push -f origin v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing uses NPM_TOKEN for this first release only: npm configures a
  # trusted publisher on a package that exists, and none of these six do yet.
  # The token is a granular, short-lived one; after the first publish the six
  # packages move to trusted publishing and the token is deleted, which is
  # carrick#874. `id-token: write` stays either way — provenance is
  # generated from it, token or no token.
  publish:
    needs: [target, binaries]
    if: ${{ needs.target.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is generated from this, with or without the token below.
      id-token: write
    steps:
      # The tag's commit, resolved once by `target`. On the dispatch path
      # `github.sha` is main's head, which is not what is being published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer; the one bundled with Node
      # 24 is older than that on some images.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Download the platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: dist/tarballs
          merge-multiple: true

      # Every step from here to `Publish carrick` is safe to re-run: a version
      # the registry already holds is skipped rather than published again, so
      # re-running a failed job resumes where it stopped (carrick#1140). Before
      # that, npm's 403 on the first already-live tarball killed every re-run.
      - name: Publish the platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/tarballs/*.tgz)
          # Publishing the main package with no platform package behind it
          # would ship a CLI that resolves no binary on any machine.
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::No platform packages were built, so there is nothing to publish."
            exit 1
          fi
          echo "publishing ${#tarballs[@]} platform package(s)"
          : > "$RUNNER_TEMP/published.txt"
          for tarball in "${tarballs[@]}"; do
            # Name and version from the tarball itself rather than from its
            # filename, so the check and the wait below ask about exactly what
            # is published — and only about that, since win32 is allowed to fail.
            manifest=$(tar -xzOf "$tarball" package/package.json)
            name=$(node -p "JSON.parse(process.argv[1]).name" "$manifest")
            version=$(node -p "JSON.parse(process.argv[1]).version" "$manifest")
            # The registry itself, not `npm view`, which answered inconsistently
            # while 0.3.71 was being processed.
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/${name//\//%2F}/$version" || true)
            if [ "$status" = "200" ]; then
              echo "$name@$version is already on the registry, skipping"
            else
              echo "publishing $tarball"
              # A version npm accepted but is still processing reads as absent
              # above, and npm refuses a second publish of it with a 409
              # "previously staged"; a live one it refuses with a 403
              # "previously published". Both mean the version is already there.
              if ! out=$(npm publish --access public "$tarball" 2>&1); then
                echo "$out"
                if grep -qE "previously (published|staged)" <<<"$out"; then
                  echo "::warning::$name@$version was already accepted and is still being processed"
                else
                  exit 1
                fi
              else
                echo "$out"
              fi
            fi
            echo "$name" >> "$RUNNER_TEMP/published.txt"
          done

      # npm does not serve a freshly published version immediately. An install
      # that runs while one of them is still invisible resolves it to nothing,
      # and the main package's install then fails on a lockfile that has lost an
      # entry — which is how 0.3.55 published five platform packages and no
      # `carrick`. npm sometimes queues a publish for processing instead: at
      # 0.3.71 one platform package took 21 minutes to become readable, past the
      # 15 minutes this step then allowed. The cap is 45 minutes for all of them
      # together, and the step's own timeout sits just above it.
      - name: Wait until the platform packages are readable
        timeout-minutes: 50
        run: |
          set -euo pipefail
          VERSION="${{ needs.target.outputs.version }}"
          DEADLINE=$(( $(date +%s) + 2700 ))
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            delay=5
            until [ "$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/${pkg//\//%2F}/$VERSION")" = "200" ]; do
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::error::$pkg@$VERSION was published but is still not readable after 45 minutes. Nothing here publishes twice, so re-run this job once the registry serves it."
                exit 1
              fi
              echo "waiting for $pkg@$VERSION (${delay}s)"
              sleep "$delay"
              if [ "$delay" -lt 60 ]; then delay=$(( delay * 2 )); else delay=60; fi
            done
            echo "$pkg@$VERSION is readable"
          done < "$RUNNER_TEMP/published.txt"

      - name: Build the type sidecar
        run: cd src/sidecar && npm ci && npm run build

      # prepack builds the emit and bundles the sidecar, and fails when the
      # sidecar imports something the package does not declare.
      - name: Publish carrick
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/carrick
          VERSION="${{ needs.target.outputs.version }}"
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/carrick/$VERSION")" = "200" ]; then
            echo "carrick@$VERSION is already on the registry, skipping"
            exit 0
          fi
          # `npm install`, not `npm ci`: nothing here needs a lockfile that
          # agrees with the manifest, and at a release no lockfile can. The
          # pins name the exact version being released, so a committed
          # lockfile's entries are always a release behind, and a regenerate is
          # only as good as what the registry served that second — 0.3.54 and
          # 0.3.55 both died here, one on stale entries and one on an entry
          # that vanished while the registry caught up. `npm install` resolves
          # fresh, tolerates an optional dependency it cannot reach, and gives
          # prepack the toolchain it needs. `npm publish` reads the manifest,
          # never the lock, and the lock is not published.
          npm install --ignore-scripts --no-audit --no-fund
          if ! out=$(npm publish --access public 2>&1); then
            echo "$out"
            grep -qE "previously (published|staged)" <<<"$out" || exit 1
            echo "::warning::carrick@$VERSION was already accepted and is still being processed"
          else
            echo "$out"
          fi

      # npm queues the main package for processing too (0.3.72), so a publish
      # that returned is not yet an install that works. Waiting here makes a
      # green job mean `npx carrick@<version>` resolves, and a stall a red job
      # that a re-run resumes.
      - name: Wait until carrick is readable
        timeout-minutes: 50
        run: |
          set -euo pipefail
          VERSION="${{ needs.target.outputs.version }}"
          DEADLINE=$(( $(date +%s) + 2700 ))
          delay=5
          until [ "$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/carrick/$VERSION")" = "200" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::carrick@$VERSION was published but is still not readable after 45 minutes. Nothing here publishes twice, so re-run this job once the registry serves it."
              exit 1
            fi
            echo "waiting for carrick@$VERSION (${delay}s)"
            sleep "$delay"
            if [ "$delay" -lt 60 ]; then delay=$(( delay * 2 )); else delay=60; fi
          done
          echo "carrick@$VERSION is readable"

  # Builds the carrick-match wasm artifact, attaches it to the release, and
  # dispatches the pin-bump PR in carrick-cloud (#325). Lives in the same
  # workflow because release-please creates the release with GITHUB_TOKEN,
  # which never fires `release:`-triggered workflows.
  wasm-artifact:
    needs: target
    if: ${{ needs.target.outputs.publish == 'true' }}
    uses: ./.github/workflows/wasm-artifact.yml
    with:
      tag: ${{ needs.target.outputs.tag_name }}
    secrets: inherit

  # The VS Code extension, packaged at the release version and published to the
  # galleries. Its own job on purpose: the extension is a manifest that starts
  # `carrick lsp --stdio`, so a gallery that is down, a token that expired or a
  # namespace that was renamed has nothing to do with the CLI, and must not stop
  # npm publishing or the Action's asset being attached.
  #
  # The version comes from release-please's extra-files entries for
  # plugin/vscode/package.json, so the checked-in manifest at the release commit
  # already carries it and `vsce package` names the file from it.
  extension:
    needs: target
    if: ${{ needs.target.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag's commit, resolved once by `target`. On the dispatch path
      # `github.sha` is main's head, which is not what is being published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Read the version from the tag
        id: version
        run: |
          echo "version=${{ needs.target.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/vscode/package-lock.json

      - name: Install
        working-directory: plugin/vscode
        run: npm ci

      # The same command the pull-request job in plugin.yml runs. A change to
      # one belongs in the other.
      # `vsce package --out dist/` does not create the directory: it writes a
      # FILE called `dist` when there is none, and the next run then fails on
      # ENOTDIR.
      - name: Package the extension
        working-directory: plugin/vscode
        run: mkdir -p dist && npx --yes @vscode/vsce package --out dist/

      # vsce names the file from the manifest, so this is the assertion that the
      # manifest was bumped with the tag rather than left behind.
      - name: The .vsix carries the release version
        id: vsix
        run: |
          set -euo pipefail
          VSIX="plugin/vscode/dist/carrick-${{ steps.version.outputs.version }}.vsix"
          if [ ! -f "$VSIX" ]; then
            echo "::error::$VSIX was not built. plugin/vscode/package.json is at $(node -p "require('./plugin/vscode/package.json').version"), not ${{ steps.version.outputs.version }}. Check the extra-files entries in release-please-config.json."
            ls -l plugin/vscode/dist
            exit 1
          fi
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      # Attached first, so that a gallery rejection still leaves a .vsix that a
      # user can install by file and the owner can upload to the Marketplace.
      - name: Attach the .vsix to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.target.outputs.tag_name }}
          files: ${{ steps.vsix.outputs.vsix }}
          # The same value action-tarball writes: the two jobs upload to one
          # release, and a disagreement here would take the flag off whichever
          # of them wrote it first.
          make_latest: ${{ needs.target.outputs.is_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Open VSX is the gallery Cursor, Windsurf and VSCodium resolve from, so
      # it reaches the editor-hosted agents this extension exists for.
      # --skip-duplicate so that re-running a release job is not an error.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OVSX_PAT is not set, so the extension cannot be published to Open VSX."
            exit 1
          fi
          npx --yes ovsx publish --skip-duplicate "${{ steps.vsix.outputs.vsix }}"

      # The Marketplace needs an Azure DevOps token, which needs a subscription
      # on the publisher's account, so there is no VSCE_PAT yet. Until there is,
      # the .vsix attached to the release above is uploaded by hand on the
      # publisher page. Skipped rather than failed: no token is the expected
      # state, not a broken release.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not set, so the Marketplace publish was skipped. Upload ${{ steps.vsix.outputs.vsix }} from the release page on the publisher's manage page."
            exit 0
          fi
          npx --yes @vscode/vsce publish --skip-duplicate --packagePath "${{ steps.vsix.outputs.vsix }}"
