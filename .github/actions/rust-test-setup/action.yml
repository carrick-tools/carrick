name: Rust test setup
description: >-
  Everything a Rust test job needs before `cargo test`: toolchain, the cargo
  cache, Node and Deno, the fixture dependencies, and a built type sidecar.
  One action rather than a copy per job so the three test shards in ci.yml
  cannot drift apart.

outputs:
  cache-hit:
    description: "true when the dependency cache restored on its exact key"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    # Keyed apart from the lint/build caches: the test jobs compile with
    # `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (ci.yml), and a target
    # directory built with full debuginfo is a full rebuild under that
    # profile, which the once-per-lockfile save would then never replace.
    # Restore only: each job ends with ./.github/actions/rust-test-cache-save,
    # which saves dependencies without this repo's own build output.
    - name: Restore dependencies
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-deps-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-deps-

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: |
          examples/express-single/package.json
          tests/fixtures/imported-routers/package.json
          tests/fixtures/fastify-api/package.json
          tests/fixtures/koa-api/package.json
          src/sidecar/package-lock.json

    - name: Install Deno for type and dependency preparation tests
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      with:
        deno-version: "2.9.4"

    - name: Install test dependencies
      shell: bash
      run: |
        cd examples/express-single && npm install
        cd ../../tests/fixtures/imported-routers && npm install
        cd ../fastify-api && npm install
        cd ../koa-api && npm install

    - name: Build sidecar
      shell: bash
      run: cd src/sidecar && npm ci && npm run build
